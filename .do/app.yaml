name: primepal-api
region: blr

services:
  - name: api
    github:
      repo: IqraMuzaffar/PrimePal
      branch: main
      deploy_on_push: true
    source_dir: backend
    dockerfile_path: backend/Dockerfile
    http_port: 8000
    instance_count: 1
    instance_size_slug: professional-xs
    health_check:
      http_path: /health
      initial_delay_seconds: 60
      period_seconds: 30
      timeout_seconds: 10
    envs:
      - key: APP_ENV
        value: "production"
      - key: SUPABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: SUPABASE_ANON_KEY
        scope: RUN_TIME
        type: SECRET
      - key: SUPABASE_SERVICE_ROLE_KEY
        scope: RUN_TIME
        type: SECRET
      - key: OPENAI_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: STUDENT_JWT_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: SECRET_KEY
        scope: RUN_TIME
        type: SECRET
      - key: REDIS_URL
        value: ${redis.DATABASE_URL}
        scope: RUN_TIME
      - key: ALLOWED_ORIGINS
        value: '["https://prime-pal-alpha.vercel.app"]'
        scope: RUN_TIME

databases:
  - name: redis
    engine: REDIS
    version: "7"
